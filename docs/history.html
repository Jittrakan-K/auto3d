<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ประวัติงาน · AUTO DESIGN 3D</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1d1c">
<link rel="stylesheet" href="style.css">
</head>
<body class="history-page">
<header class="bar">
  <a class="brand" href="./">
    <img class="logo" src="favicon.svg" width="32" height="32" alt="">
    <span class="wordmark">AUTO DESIGN <span>3D</span></span>
  </a>
  <div class="status">
    <a class="btn primary" href="./">สร้างงานใหม่</a>
  </div>
</header>

<main class="log">
  <div class="log-head">
    <div>
      <h1>ประวัติการสร้างงาน</h1>
      <p class="muted" id="log-count"></p>
    </div>
    <div class="log-tools">
      <input id="log-search" type="search" placeholder="ค้นหาชื่อหรือคำสั่ง" aria-label="ค้นหาในประวัติ">
      <button id="log-export" class="btn" type="button">สำรองเป็นไฟล์</button>
      <button id="log-import" class="btn" type="button">นำเข้าไฟล์สำรอง</button>
      <input id="log-file" type="file" accept=".json,application/json" hidden>
    </div>
  </div>
  <p class="muted small">ประวัติเก็บในเบราว์เซอร์นี้เท่านั้น เปิดจากเครื่องอื่นหรือล้างข้อมูลเบราว์เซอร์จะไม่เห็น ใช้ "สำรองเป็นไฟล์" เพื่อย้ายไปเครื่องอื่น</p>
  <p id="log-msg" class="note" hidden></p>

  <div id="log-empty" class="log-empty" hidden>
    <p>ยังไม่มีงานในประวัติ งานที่สร้างจากหน้าหลักจะถูกเก็บไว้ที่นี่อัตโนมัติ</p>
    <a class="btn primary" href="./">ไปสร้างงานแรก</a>
  </div>
  <ol id="log-list" class="log-list"></ol>
</main>
<script type="module" src="history-page.js"></script>
</body>
</html>
