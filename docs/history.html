<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History · AUTO3D</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8f86ea">
<link rel="stylesheet" href="style.css?v=202611141810">
</head>
<body class="history-page">
<div class="backdrop" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="app app-2">
  <nav class="rail" aria-label="Main menu">
    <a class="rail-logo" href="./" aria-label="AUTO3D home"><img src="favicon.svg" width="34" height="34" alt=""></a>
    <a class="rail-btn" href="./" title="New part"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New</span></a>
    <a class="rail-btn active" href="history.html" aria-current="page" title="History"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>History</span></a>
    <a class="rail-btn" href="drawing.html" title="2D drawing"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 15.5h17M13 15.5v4M7 8h5v5H7z"/></svg><span>Drawing</span></a>
    <span class="rail-gap"></span>
  </nav>
<main class="log stage">
  <div class="log-head">
    <div>
      <h1>History</h1>
      <p class="muted" id="log-count"></p>
    </div>
    <div class="log-tools">
      <input id="log-search" type="search" placeholder="Search name or command" aria-label="Search history">
      <button id="log-export" class="btn" type="button">Back up</button>
      <button id="log-import" class="btn" type="button">Restore</button>
      <input id="log-file" type="file" accept=".json,application/json" hidden>
    </div>
  </div>
  <p class="muted small">History is kept in this browser only. Use Back up and Restore to move it to another computer</p>
  <p id="log-msg" class="note" hidden></p>

  <div id="log-empty" class="log-empty" hidden>
    <p>No parts yet. Every part you build is saved here</p>
    <a class="btn primary" href="./">Build your first part</a>
  </div>
  <ol id="log-list" class="log-list"></ol>
</main>
</div>
<script type="module" src="history-page.js?v=202611141810"></script>
</body>
</html>
